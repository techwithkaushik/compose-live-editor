name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm32:
    name: Build ARM32 debug APK and compiler spike test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Build compiler ART spike instrumentation APK
        run: gradle --no-daemon :app:assembleDebugAndroidTest
      - name: Verify APKs exist
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: compose-live-editor-arm32-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload compiler ART spike test APK
        uses: actions/upload-artifact@v4
        with:
          name: compose-live-editor-compiler-art-spike-test
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

      - name: Run compiler spike tests on Android ART (x86_64 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            set -eu
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            set +e
            timeout 180s adb shell am instrument -w -r \
              com.techwithkaushik.composeliveeditor.test/androidx.test.runner.AndroidJUnitRunner \
              > instrumentation.log 2>&1
            test_status=$?
            set -e
            cat instrumentation.log
            if [ "$test_status" -ne 0 ]; then
              echo "Instrumentation failed or timed out (exit $test_status). Recent Android logs:"
              adb logcat -d -t 1500
              exit "$test_status"
            fi
