name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test engine and build single APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run engine unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build the only APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify single APK output
        run: |
          set -eu
          test -s app/build/outputs/apk/debug/app-debug.apk
          count=$(find app/build/outputs/apk -type f -name '*.apk' | wc -l)
          test "$count" -eq 1
          echo "Verified exactly one APK:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/[^/]+/.*\.so$' || true

      - name: Upload single debug APK
        uses: actions/upload-artifact@v4
        with:
          name: compose-live-editor
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
